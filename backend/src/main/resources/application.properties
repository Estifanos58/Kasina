spring.application.name=ChatAPP

# MongoDB configuration
spring.data.mongodb.uri=${MONGODB_CONNECTION_STRING:mongodb://localhost:27017/chat_app}
spring.data.mongodb.database=${MONGODB_NAME:chat_app}
spring.data.mongodb.auto-index-creation=true

# Server and Multipart configuration
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.tomcat.max-http-header-size=65536
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT Configuration (JWT_SECRET is mandatory and validated on startup; no insecure fallback)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.cookie-name=jwt
jwt.cookie-secure=${COOKIE_SECURE:false}
jwt.cookie-same-site=${COOKIE_SAME_SITE:Lax}

# Login & Signup Rate Limiting
security.rate-limit.login.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
security.rate-limit.login.max-ip-attempts=${LOGIN_RATE_LIMIT_MAX_IP_ATTEMPTS:20}
security.rate-limit.signup.max-ip-attempts=${SIGNUP_RATE_LIMIT_MAX_IP_ATTEMPTS:10}
security.rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:900000}
security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:true}

# WebSocket Heartbeat
websocket.heartbeat-ms=${WEBSOCKET_HEARTBEAT_MS:10000}

# File Upload Configuration
file.upload-dir=${FILE_UPLOAD_DIR:uploads/files}

# CORS & WebSocket Allowed Origins
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Logging configuration
logging.level.com.schoolproject.ChatAPP=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
