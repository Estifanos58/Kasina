services:
  mongodb:
    image: mongo:7.0
    container_name: kasina-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
      MONGO_INITDB_DATABASE: ${MONGODB_NAME:-chat_app}
    volumes:
      - mongo_data:/data/db
    networks:
      - kasina-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kasina-backend
    restart: unless-stopped
    environment:
      MONGODB_CONNECTION_STRING: mongodb://${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}@mongodb:27017/${MONGODB_NAME:-chat_app}?authSource=admin
      MONGODB_NAME: ${MONGODB_NAME:-chat_app}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (min 32 characters)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set (e.g. http://localhost:3000 or https://chat.example.com)}
      PORT: 8080
      FILE_UPLOAD_DIR: /app/uploads/files
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_MAX_IP_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_IP_ATTEMPTS:-20}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      TRUST_FORWARDED_HEADERS: ${TRUST_FORWARDED_HEADERS:-true}
      WEBSOCKET_HEARTBEAT_MS: ${WEBSOCKET_HEARTBEAT_MS:-10000}
    volumes:
      - upload_data:/app/uploads/files
    networks:
      - kasina-internal
      - kasina-edge
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SERVER_URL: ""
        VITE_SOCKET_URL: "/ws"
    container_name: kasina-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    networks:
      - kasina-edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/nginx-health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  kasina-internal:
    driver: bridge
    internal: true
  kasina-edge:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  upload_data:
    driver: local
